<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Original graphics and sound translated to JavaScript.">
  <title>DOS Demo — Demo Group</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="shell">
    <canvas id="screen" width="640" height="400" aria-label="DOS Demo"></canvas>
    <section id="gate" aria-label="DOS Demo">
      <canvas id="background" width="320" height="200" aria-hidden="true"></canvas>
      <div class="shade" aria-hidden="true"></div>
      <div class="gate-content">
        <h1><span id="demo-title">DOS Demo</span></h1>
        <p class="group" id="demo-group">Demo Group</p>
        <p class="meta" id="demo-meta"></p>
        <dl class="credits" id="demo-credits"></dl>
        <button id="start" class="start" type="button" disabled>Preparing<span class="dots" aria-hidden="true"></span></button>
      </div>
      <footer>
        <nav aria-label="Production links"><a id="pouet-link" hidden>Pouët</a><a id="github-link" hidden>GitHub</a></nav>
        <p><kbd>space</kbd> pause · <kbd>← →</kbd> seek · <kbd>f</kbd> fullscreen · <kbd>esc</kbd> stop</p>






      </footer>
    </section>
    <div id="hud" hidden>
      <button id="pause" type="button" aria-label="Pause demo">Pause</button>
      <button id="stop" type="button">Stop</button>
      <button id="backward" type="button" aria-label="Back 15 seconds">−15s</button><button id="forward" type="button" aria-label="Forward 15 seconds">+15s</button>
      <input id="timeline" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek demo">

      <output id="time">0:00</output>
      <button id="fullscreen" type="button">Fullscreen</button>
      <label class="stats-switch"><input id="stats-toggle" type="checkbox" role="switch" aria-controls="stats">Stats for nerds</label>
      <label>Scale <select id="scale" aria-label="Display scale"><option value="1">1x</option><option value="0.5">0.5x</option></select></label>
      <label>Volume <input id="volume" type="range" min="0" max="1" step="0.01" value="0.7"></label>
    </div>
    <div id="loading" hidden role="status" aria-live="polite"><span>Loading…</span></div>
    <section id="nerd-panel" hidden aria-label="Stats and live module tracker">
      <output id="stats" aria-label="Displayed frames per second">FPS: —</output>
      <div id="player-details"></div><div id="tracker-title">Original-code audio diagnostics</div>
      <div class="tracker-scroll"><canvas id="tracker" width="608" height="208" aria-label="Original sound diagnostics"></canvas></div>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="app/app.mjs"></script>
<script type="module" src="app/shell.mjs"></script>
</body>
</html>
